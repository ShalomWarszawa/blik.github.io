<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przelew BLIK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .phone-box {
            background-color: #eef2f5;
            border: 2px dashed #007bff;
            border-radius: 16px;
            padding: 18px 10px;
            margin-bottom: 25px;
        }
        .phone-number {
            font-size: 32px;
            font-weight: 800;
            color: #007bff;
            letter-spacing: 2px;
        }
        .copy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.35);
            transition: background-color 0.2s, transform 0.1s;
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
        .hint {
            margin-top: 25px;
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Przelew BLIK</h1>

    <div class="phone-box">
        <div class="phone-number">786 589 244</div>
    </div>

    <button class="copy-btn" id="copyBtn" onclick="copyNumber()">Kopiuj numer</button>

    <p class="hint">Otwórz aplikację banku i wybierz <strong>Przelew na telefon BLIK</strong></p>
</div>

<script>
    function copyNumber() {
        const rawNumber = "786589244";
        
        navigator.clipboard.writeText(rawNumber).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = "✓ Skopiowano!";
            btn.style.backgroundColor = "#1e7e34";
            
            setTimeout(() => {
                btn.innerText = "Kopiuj numer";
                btn.style.backgroundColor = "#28a745";
            }, 3000);
        }).catch(err => {
            alert("Numer: " + rawNumber);
        });
    }
</script>

</body>
</html>
