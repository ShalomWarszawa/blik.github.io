<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Przelew BLIK</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        button {
            -webkit-appearance: none;
            appearance: none;
            outline: none;
        }
        button:focus,
        button:focus-visible {
            outline: none;
        }
        body {
            background: linear-gradient(160deg, #f4f6f8 0%, #e9eff5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 30px 25px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 400px;
            width: 100%;
            position: relative;
        }

        /* Flag icons (SVG, inline) */
        .flag-icon {
            display: inline-block;
            width: 22px;
            height: 16px;
            border-radius: 3px;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.08);
        }
        .flag-icon svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Language dropdown */
        .lang-dropdown {
            position: relative;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }
        .lang-current {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #eef2f5;
            border: 1px solid #e0e5ea;
            border-radius: 12px;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            transition: background-color 0.2s, border-color 0.2s;
            user-select: none;
        }
        .lang-current:hover,
        .lang-current:active {
            background: #e6ebf0;
        }
        .lang-current .chevron {
            width: 8px;
            height: 8px;
            border-right: 2px solid #888;
            border-bottom: 2px solid #888;
            transform: rotate(45deg);
            transition: transform 0.25s ease;
            margin-top: -3px;
        }
        .lang-dropdown.open .chevron {
            transform: rotate(-135deg);
            margin-top: 3px;
        }
        .lang-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: #ffffff;
            border: 1px solid #e5e9ec;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            overflow: hidden;
            min-width: 160px;
            opacity: 0;
            transform: translateY(-6px) scale(0.98);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 20;
        }
        .lang-dropdown.open .lang-menu {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .lang-option {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14.5px;
            font-weight: 600;
            color: #333;
            text-align: left;
            transition: background-color 0.15s;
        }
        .lang-option:hover,
        .lang-option:active {
            background-color: #f2f6fa;
        }
        .lang-option.active {
            background-color: #e6f0ff;
            color: #007bff;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #1a1a1a;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .phone-box {
            background-color: #eef2f5;
            border: 2px dashed #007bff;
            border-radius: 16px;
            padding: 18px 10px;
            margin-bottom: 25px;
        }
        .phone-number {
            font-size: 32px;
            font-weight: 800;
            color: #007bff;
            letter-spacing: 2px;
        }
        .copy-btn {
            background-color: #28a745;
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(40, 167, 69, 0.35);
            transition: background-color 0.2s, transform 0.1s;
            touch-action: manipulation;
        }
        .copy-btn:active {
            transform: scale(0.98);
        }
        .hint {
            margin-top: 25px;
            font-size: 15px;
            color: #666;
            line-height: 1.4;
        }

        /* Instructions accordion */
        .accordion {
            margin-top: 20px;
            text-align: left;
            border: 1px solid #e5e9ec;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fafbfc;
        }
        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 18px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .accordion-header:hover,
        .accordion-header:active {
            background-color: #f2f6fa;
        }
        .accordion-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .accordion-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #007bff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .accordion-chevron {
            width: 10px;
            height: 10px;
            border-right: 2px solid #888;
            border-bottom: 2px solid #888;
            transform: rotate(45deg);
            transition: transform 0.25s ease;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .accordion.open .accordion-chevron {
            transform: rotate(-135deg);
            margin-top: 4px;
        }
        .accordion-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .accordion.open .accordion-body {
            max-height: 600px;
        }
        .accordion-body-inner {
            padding: 4px 18px 16px;
        }
        .steps {
            list-style: none;
            counter-reset: step;
        }
        .steps li {
            counter-increment: step;
            position: relative;
            padding: 0 0 16px 38px;
            font-size: 14.5px;
            color: #333;
            line-height: 1.4;
        }
        .steps li:last-child {
            padding-bottom: 4px;
        }
        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: -2px;
            width: 26px;
            height: 26px;
            background-color: #007bff;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="lang-dropdown" id="langDropdown">
        <div class="lang-current" id="langCurrent" onclick="toggleDropdown()">
            <span class="flag-icon" id="currentFlagIcon"></span>
            <span id="currentLangName">PL</span>
            <span class="chevron"></span>
        </div>
        <div class="lang-menu" id="langMenu">
            <button class="lang-option active" data-lang="pl" onclick="setLang('pl')">
                <span class="flag-icon" data-flag="pl"></span> Polski
            </button>
            <button class="lang-option" data-lang="en" onclick="setLang('en')">
                <span class="flag-icon" data-flag="gb"></span> English
            </button>
            <button class="lang-option" data-lang="ru" onclick="setLang('ru')">
                <span class="flag-icon" data-flag="ru"></span> Русский
            </button>
        </div>
    </div>

    <h1 data-i18n="title">Przelew BLIK</h1>

    <div class="phone-box">
        <div class="phone-number">786 589 244</div>
    </div>

    <button class="copy-btn" id="copyBtn" onclick="copyNumber()" data-i18n="copyBtn">Kopiuj numer</button>

    <p class="hint" data-i18n="hint">Otwórz aplikację banku i wybierz <strong>Przelew na telefon BLIK</strong></p>

    <div class="accordion" id="instrAccordion">
        <button class="accordion-header" onclick="toggleAccordion()">
            <span class="accordion-header-left">
                <span class="accordion-icon">?</span>
                <span data-i18n="instrTitle">Jak wysłać pieniądze BLIKIEM</span>
            </span>
            <span class="accordion-chevron"></span>
        </button>
        <div class="accordion-body">
            <div class="accordion-body-inner">
                <ol class="steps" id="stepsList"></ol>
            </div>
        </div>
    </div>

</div>

<script>
    const flagSVGs = {
        pl: '<svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg"><rect width="3" height="1" y="0" fill="#ffffff"/><rect width="3" height="1" y="1" fill="#dc143c"/></svg>',
        gb: '<svg viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="40" fill="#00247d"/><path d="M0,0 60,40 M60,0 0,40" stroke="#ffffff" stroke-width="8"/><path d="M0,0 60,40 M60,0 0,40" stroke="#cf142b" stroke-width="2.7"/><path d="M30,0 30,40 M0,20 60,20" stroke="#ffffff" stroke-width="13.3"/><path d="M30,0 30,40 M0,20 60,20" stroke="#cf142b" stroke-width="8"/></svg>',
        ru: '<svg viewBox="0 0 3 2" xmlns="http://www.w3.org/2000/svg"><rect width="3" height="0.666" y="0" fill="#ffffff"/><rect width="3" height="0.666" y="0.666" fill="#0039a6"/><rect width="3" height="0.666" y="1.333" fill="#d52b1e"/></svg>'
    };

    const translations = {
        pl: {
            name: "PL",
            flag: "pl",
            title: "Przelew BLIK",
            copyBtn: "Kopiuj numer",
            copyBtnDone: "✓ Skopiowano!",
            hint: 'Otwórz aplikację banku i wybierz <strong>Przelew na telefon BLIK</strong>',
            instrTitle: "Jak wysłać pieniądze BLIKIEM",
            steps: [
                "Otwórz aplikację swojego banku na telefonie.",
                "Zaloguj się i przejdź do sekcji <strong>BLIK</strong> lub <strong>Płatności</strong>.",
                "Wybierz opcję <strong>Przelew na telefon</strong>.",
                "Wpisz numer telefonu: <strong>786 589 244</strong> (możesz go skopiować przyciskiem powyżej).",
                "Wpisz kwotę przelewu i zatwierdź.",
                "Potwierdź płatność kodem BLIK z aplikacji bankowej."
            ]
        },
        en: {
            name: "EN",
            flag: "gb",
            title: "BLIK Transfer",
            copyBtn: "Copy number",
            copyBtnDone: "✓ Copied!",
            hint: 'Open your banking app and choose <strong>Transfer to phone (BLIK)</strong>',
            instrTitle: "How to send money via BLIK",
            steps: [
                "Open your bank's app on your phone.",
                "Log in and go to the <strong>BLIK</strong> or <strong>Payments</strong> section.",
                "Select <strong>Transfer to phone number</strong>.",
                "Enter the phone number: <strong>786 589 244</strong> (you can copy it using the button above).",
                "Enter the amount and confirm.",
                "Confirm the payment with the BLIK code from your banking app."
            ]
        },
        ru: {
            name: "RU",
            flag: "ru",
            title: "Перевод BLIK",
            copyBtn: "Скопировать номер",
            copyBtnDone: "✓ Скопировано!",
            hint: 'Откройте приложение банка и выберите <strong>Перевод на телефон BLIK</strong>',
            instrTitle: "Как отправить деньги через BLIK",
            steps: [
                "Откройте приложение своего банка на телефоне.",
                "Войдите в аккаунт и перейдите в раздел <strong>BLIK</strong> или <strong>Платежи</strong>.",
                "Выберите опцию <strong>Перевод на номер телефона</strong>.",
                "Введите номер телефона: <strong>786 589 244</strong> (можно скопировать кнопкой выше).",
                "Введите сумму перевода и подтвердите.",
                "Подтвердите платёж кодом BLIK из банковского приложения."
            ]
        }
    };

    let currentLang = "pl";

    function renderFlags() {
        document.querySelectorAll('.flag-icon[data-flag]').forEach(el => {
            el.innerHTML = flagSVGs[el.dataset.flag];
        });
        document.getElementById('currentFlagIcon').innerHTML = flagSVGs[translations[currentLang].flag];
    }

    function setLang(lang) {
        currentLang = lang;
        const t = translations[lang];

        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (t[key] !== undefined) {
                el.innerHTML = t[key];
            }
        });

        const stepsList = document.getElementById('stepsList');
        stepsList.innerHTML = t.steps.map(s => `<li>${s}</li>`).join('');

        document.getElementById('currentFlagIcon').innerHTML = flagSVGs[t.flag];
        document.getElementById('currentLangName').textContent = t.name;

        document.querySelectorAll('.lang-option').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        document.documentElement.lang = lang;
        closeDropdown();
    }

    function toggleDropdown() {
        document.getElementById('langDropdown').classList.toggle('open');
    }
    function closeDropdown() {
        document.getElementById('langDropdown').classList.remove('open');
    }

    function toggleAccordion() {
        document.getElementById('instrAccordion').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('langDropdown');
        if (!dropdown.contains(e.target)) {
            closeDropdown();
        }
    });

    function copyNumber() {
        const rawNumber = "786589244";
        const t = translations[currentLang];

        navigator.clipboard.writeText(rawNumber).then(() => {
            const btn = document.getElementById('copyBtn');
            btn.innerText = t.copyBtnDone;
            btn.style.backgroundColor = "#1e7e34";

            setTimeout(() => {
                btn.innerText = t.copyBtn;
                btn.style.backgroundColor = "#28a745";
            }, 3000);
        }).catch(err => {
            alert("Numer: " + rawNumber);
        });
    }

    renderFlags();
    setLang('pl');
</script>

</body>
</html>
